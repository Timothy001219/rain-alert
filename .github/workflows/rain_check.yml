name: Rain Check Workflow

on:
  schedule:
    # 預設使用 UTC 時間，每 5 分鐘執行一次
    - cron: '*/5 * * * *'
  workflow_dispatch: # 允許手動點擊按鈕測試

jobs:
  run-rain-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python rain.py
