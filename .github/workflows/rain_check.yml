name: 天氣監控與 Discord 警報

on:
  schedule:
    # 每 10 分鐘自動執行一次 (UTC 時間)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 支援在 GitHub 介面上手動點擊測試

jobs:
  check-weather:
    runs-on: ubuntu-latest

    # 必須開啟寫入權限，才能讓 Git 把紀錄檔 Commit 並 Push 回去
    permissions:
      contents: write

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: 執行天氣監控腳本
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python rain.py

      - name: Commit 並 Push 歷史紀錄檔
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add last_alert.json alert_history.log || true
          
          # 若有歷史紀錄更新才做 Commit，避免無變更時報錯
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新天氣警報歷史紀錄 [skip ci]"
            git push
          else
            echo "無新發送紀錄，跳過 Commit"
          fi
