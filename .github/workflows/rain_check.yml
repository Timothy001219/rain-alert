name: 天氣監控與 Discord 警報

on:
  schedule:
    # 每 10 分鐘自動執行一次 (UTC 時間)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 支援在 GitHub 介面上手動點擊測試

jobs:
  check-weather:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      # 下載上一次發佈的紀錄檔（避免發送重複訊息）
      - name: 下載歷史紀錄
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: last-alert-data
          path: .

      - name: 執行天氣監控腳本
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python rain.py

      # 上傳本次執行後產生的紀錄檔（會覆蓋同名 Artifact）
      - name: 上傳更新後的歷史紀錄
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-alert-data
          path: last_alert.json
          retention-days: 1
          overwrite: true
