name: Daily Stock Analysis

on:
  schedule:
    # 每天 UTC 21:00 執行（等於台灣時間每天清晨 05:00）
    - cron: '0 21 * * *'  
  workflow_dispatch: # 支援手動觸發

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    
    # 賦予 GitHub Actions 寫入倉庫的權限
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 抓取完整歷史紀錄，避免 Git push 衝突

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'    # 快取 pip 套件加速執行

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests streamlit yfinance

      - name: Run daily analysis script
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python daily_job.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_cache.json
          
          # 檢查是否有變更，若沒有變更則不進行 commit
          git diff --staged --quiet || git commit -m "chore: update daily stock cache [skip ci]"
          
          # 推回當前分支
          git push origin HEAD:main
