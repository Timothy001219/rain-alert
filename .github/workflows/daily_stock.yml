name: Manual Stock Analysis

on:
  workflow_dispatch: # 移除 schedule，改為僅支援手動點擊觸發

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests streamlit yfinance

      - name: Run manual analysis script
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python daily_job.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_cache.json
          git diff --staged --quiet || git commit -m "chore: 手動更新台股快取資料 [skip ci]"
          git push origin HEAD:main
